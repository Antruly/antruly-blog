name: Deploy to Cloudflare Workers

on:
  push:
    # 注意：如果之后把仓库默认分支改成 main，这里也要同步改
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须跑完整流水线：LQIP 占位图、字体子集、Pagefind 索引都挂在这条链上，
      # 只跑 astro build 会缺东西。
      #
      # GITHUB_TOKEN 是 Actions 自动注入的内置 secret，不需要额外配置；它只在这台
      # runner 的构建进程里可见，不会进产物。流水线里的两条 GitHub 抓取
      # （项目卡片数据、活动同步）没有它就会退化成匿名调用，撞上 60 次/小时的限额。
      - name: Build site
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 需要在仓库 Settings → Secrets and variables → Actions 里配置：
      #   CLOUDFLARE_API_TOKEN   —— 权限至少要有 Workers Scripts:Edit
      #   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 面板右侧的 Account ID
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
